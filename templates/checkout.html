<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout VIP</title>

<script src="https://sdk.mercadopago.com/js/v2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

.container{
    max-width:450px;
    margin:auto;
}

.banner{
    width:100%;
    border-radius:20px;
    box-shadow:0 0 25px rgba(255,0,120,.5);
}

h1{
    margin-top:20px;
    font-size:35px;
}

.texto{
    margin-top:15px;
    color:#ccc;
    line-height:28px;
    font-size:18px;
}

.pixBox{
    background:#111;
    padding:20px;
    border-radius:20px;
    margin-top:30px;
}

button{
    width:100%;
    padding:18px;
    border:none;
    border-radius:15px;
    background:#ff0080;
    color:white;
    font-size:20px;
    font-weight:bold;
    margin-top:15px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

textarea{
    width:100%;
    height:120px;
    margin-top:20px;
    border:none;
    border-radius:15px;
    padding:15px;
    resize:none;
    background:#1a1a1a;
    color:white;
}

#paymentBrick_container{
    background:white;
    padding:15px;
    border-radius:20px;
    margin-top:35px;
}

</style>

</head>

<body>

<div class="container">

<img src="/static/foto1.jpg" class="banner">

<h1>🔥 Acesso VIP 🔥</h1>

<div class="texto">
🔞 Conteúdo exclusivo liberado imediatamente.<br><br>

💋 Grupo VIP atualizado diariamente.<br>

🎥 Lives privadas e conteúdos premium.
</div>

<div class="pixBox">

<h2>⚡ Pagamento via Pix</h2>

<button onclick="gerarPix()">
GERAR PIX
</button>

<div id="pixArea"></div>

</div>

<h2 style="margin-top:40px;">
💳 Cartão e boleto
</h2>

<div id="paymentBrick_container"></div>

</div>

<script>

async function gerarPix(){

    document.getElementById("pixArea").innerHTML =
    "Gerando Pix...";

    const response = await fetch("/process_payment", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            payment_method_id:"pix",
            payer:{
                email:"teste@teste.com"
            }
        })
    });

    const data = await response.json();

    if(data.error){

        document.getElementById("pixArea").innerHTML =
        "Erro ao gerar Pix";

        return;
    }

    document.getElementById("pixArea").innerHTML = `

        <img
        src="data:image/png;base64,${data.qr_base64}"
        width="250"
        style="
        margin-top:20px;
        border-radius:20px;
        "
        >

        <textarea id="pixCode">
${data.qr_code}
</textarea>

        <button onclick="copiarPix()">
        COPIAR PIX
        </button>
    `;
}

function copiarPix(){

    const pix =
    document.getElementById("pixCode");

    navigator.clipboard.writeText(
        pix.value
    );

    alert("Pix copiado!");
}

const mp = new MercadoPago(
"APP_USR-8b7b990d-87cf-4825-8235-a82877896e28",
{
    locale:"pt-BR"
}
);

const bricksBuilder = mp.bricks();

bricksBuilder.create(
"wallet",
"paymentBrick_container",
{
    initialization:{
        preferenceId:"{{ preference_id }}"
    }
}
);

</script>

</body>
</html>
