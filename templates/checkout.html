<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pagamento VIP</title>

<style>

.container{

    margin:auto;

    margin-top:20px;

}

h1{

.texto{

    margin-top:15px;

    font-size:18px;
}

.pagamentos{
    margin-top:20px;
    font-size:18px;
    color:#fff;

.botao{
    width:100%;
    padding:18px;
    margin-top:20px;
    border:none;
    border-radius:15px;
    background:#ff0080;
    color:white;
    font-size:22px;
    font-weight:bold;
    text-decoration:none;
    display:block;

.seguro{
    margin-top:18px;
    color:#888;
    font-size:14px;

</head>

<body>

<div class="container">

<img src="/static/foto1.jpg" class="banner">

</div>

</div>
