<!DOCTYPE html>

<head>

<title>Pagamento VIP</title>

<body>

</div>

<div id="wallet_container"></div>

<script>

const mp = new MercadoPago("APP_USR-8b7b990d-87cf-4825-8235-a82877896e28", {
    locale: "pt-BR"
});

    }
});

</script>
