<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pagamento VIP</title>

<script src="https://sdk.mercadopago.com/js/v2"></script>

<style>

body{
    background:#000;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
    margin:0;
}

.banner{
    width:95%;
    max-width:420px;
    border-radius:25px;
    margin-top:20px;
    box-shadow:0 0 30px #ff0080;
}

h1{
    margin-top:25px;
    font-size:42px;
}

.texto{
    color:#ccc;
    margin-top:15px;
    line-height:32px;
    font-size:20px;
}

.pixBox{
    background:#111;
    border-radius:25px;
    padding:25px;
    margin-top:35px;
    box-shadow:0 0 20px rgba(255,0,128,0.3);
}

textarea{
    width:100%;
    height:120px;
    margin-top:20px;
    border:none;
    border-radius:18px;
    padding:15px;
    background:#1a1a1a;
    color:white;
    resize:none;
    font-size:15px;
}

button{
    width:100%;
    padding:20px;
    border:none;
    border-radius:18px;
    background:#ff0080;
    color:white;
    font-size:22px;
    font-weight:bold;
    margin-top:18px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

#paymentBrick_container{
    margin-top:40px;
    background:white;
    padding:15px;
    border-radius:20px;
}

.cartaoTitulo{
    margin-top:45px;
    font-size:30px;
}

</style>

</head>

<body>

<img src="/static/foto1.jpg" class="banner">

<h1>🔥 Acesso VIP 🔥</h1>

<div class="texto">
🔞 Conteúdo exclusivo liberado imediatamente.<br><br>

💋 Grupo VIP atualizado diariamente.<br>

🎥 Lives privadas e conteúdos premium.<br><br>

💳 Aceitamos Pix, Crédito e Débito.
</div>

<div class="pixBox">

<h2>⚡ Pagar com Pix</h2>

<div id="pixArea">
Carregando Pix...
</div>

</div>

<h2 class="cartaoTitulo">
💳 Cartão e boleto
</h2>

<div id="paymentBrick_container"></div>

<script>

async function gerarPix(){

    const response = await fetch("/process_payment", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            payer: {
                email: "cliente@email.com"
            }
        })

    });

    const data = await response.json();

    document.getElementById("pixArea").innerHTML = `

        <img
        src="data:image/png;base64,${data.qr_base64}"
        width="250"
        style="
        border-radius:20px;
        margin-top:15px;
        "
        >

        <textarea id="pixCode">${data.qr_code}</textarea>

        <button onclick="copiarPix()">
        COPIAR PIX
        </button>
    `;
}

function copiarPix(){

    const pix = document.getElementById("pixCode");

    pix.select();

    pix.setSelectionRange(0, 99999);

    document.execCommand("copy");

    alert("Pix copiado!");
}

gerarPix();

const mp = new MercadoPago(
"APP_USR-8b7b990d-87cf-4825-8235-a82877896e28",
{
    locale: "pt-BR"
}
);

const bricksBuilder = mp.bricks();

bricksBuilder.create(
"payment",
"paymentBrick_container",
{
    initialization: {
        amount: 25
    },

    customization: {
        paymentMethods: {
            maxInstallments: 12
        }
    }
}
);

</script>

</body>
    </html>
