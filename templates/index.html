<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP 🔥</title>

<style>
body {
    margin:0;
    font-family:Arial;
    background:url('https://images.unsplash.com/photo-1601758064224-2b5b4e6e6c2f') no-repeat center;
    background-size:cover;
    color:white;
}

.overlay {
    background:rgba(0,0,0,0.7);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box {
    text-align:center;
    width:90%;
    max-width:400px;
}

h1 {margin-bottom:20px;}

.btn {
    display:block;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
    text-decoration:none;
    color:white;
    font-weight:bold;
}

.vip {background:#ff8c00;}
.live {background:#e60023;}
.only {background:#111;}
</style>
</head>

<body>

<div class="overlay">
<div class="box">

<h1>🔥 Acesso Exclusivo</h1>

<a href="/checkout?produto=vip" class="btn vip">Grupo VIP</a>
<a href="/checkout?produto=live" class="btn live">Live</a>
<a href="/checkout?produto=only" class="btn only">OnlyFans</a>

</div>
</div>

</body>
</html>
