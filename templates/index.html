<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pagamento VIP</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    font-family:Arial, sans-serif;
    color:white;
    text-align:center;
}

.container{
    padding:25px;
    max-width:450px;
    margin:auto;
}

.banner{
    width:100%;
    border-radius:20px;
    margin-top:20px;
    box-shadow:0 0 25px rgba(255,0,120,.5);
}

h1{
    font-size:34px;
    margin-top:20px;
}

.texto{
    color:#ccc;
    margin-top:15px;
    line-height:28px;
    font-size:18px;
}

.pagamentos{
    margin-top:20px;
    font-size:18px;
    color:#fff;
}

input{
    width:100%;
    padding:18px;
    margin-top:25px;
    border:none;
    border-radius:15px;
    font-size:18px;
    background:#111;
    color:white;
}

button{
    width:100%;
    padding:18px;
    margin-top:20px;
    border:none;
    border-radius:15px;
    background:#ff0080;
    color:white;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.seguro{
    margin-top:18px;
    color:#888;
    font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<img src="/static/foto1.jpg" class="banner">

<h1>🔥 Acesso VIP 🔥</h1>

<div class="texto">
🔞 Conteúdo exclusivo liberado imediatamente após o pagamento.<br><br>

💋 Grupo VIP atualizado diariamente.<br>

🎥 Lives privadas e conteúdos premium.
</div>

<div class="pagamentos">
💳 Aceitamos Pix, Crédito e Débito
</div>

<form method="POST">

<input
type="email"
name="email"
placeholder="Digite seu melhor e-mail"
required
>

<input
type="hidden"
name="produto"
value="vip"
>

<button type="submit">
🔥 CONTINUAR PAGAMENTO
</button>

</form>

<div class="seguro">
Pagamento 100% seguro e processado automaticamente.
</div>

</div>

</body>
</html>
